
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">

  <title>My App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Full-screen loading background */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      gap: 22px;

      background: linear-gradient(
        135deg,
        #101827,
        #243b55,
        #141e30
      );

      color: #ffffff;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    /* Centered GIF */
    .loader-gif {
      display: block;
      width: min(180px, 48vw);
      max-height: 180px;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
    }

    /* Motivational quote */
    .quote {
      max-width: 360px;
      min-height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      font-size: clamp(17px, 4vw, 22px);
      line-height: 1.6;
      font-weight: 500;
      color: #ffffff;

      animation: breathe 2s ease-in-out infinite;
    }

    /* Animated loading dots */
    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #93c5fd;
      animation: bounce 1s infinite ease-in-out;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    .loading-text {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      color: #cbd5e1;
    }

    /* Fade-out state */
    #loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-7px);
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 0.7;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      #loading-screen {
        gap: 18px;
        padding: 20px;
      }

      .loader-gif {
        width: min(150px, 45vw);
        max-height: 150px;
      }

      .quote {
        max-width: 320px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .quote,
      .dots span {
        animation: none;
      }

      #loading-screen {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- Loading screen -->
  <div id="loading-screen">

    <!-- Keep loader.gif inside the web folder -->
    <img
      class="loader-gif"
      src="loader.gif"
      alt="Loading application"
    >

    <div class="quote" id="quote">
      Great things take time. Enjoy the journey.
    </div>

    <div class="dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="loading-text">
      Preparing your experience
    </div>

  </div>

  <!-- Rotating quotes -->
  <script>
    const quotes = [
      "Great things take time. Enjoy the journey.",
      "Every moment is a fresh beginning.",
      "Small steps lead to great things.",
      "Believe in the beauty of your dreams.",
      "Make today something wonderful.",
      "Your next adventure starts here."
    ];

    let quoteIndex = 0;

    setInterval(() => {
      quoteIndex = (quoteIndex + 1) % quotes.length;

      const quoteElement = document.getElementById("quote");

      if (quoteElement) {
        quoteElement.textContent = quotes[quoteIndex];
      }
    }, 2500);
  </script>

  <!-- Flutter initialization -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Keep loader for at least 3 seconds -->
  <script>
    (() => {
      const loaderStartTime = Date.now();
      const minimumLoaderTime = 3000;
      let firstFrameHandled = false;

      window.addEventListener("flutter-first-frame", () => {
        if (firstFrameHandled) return;
        firstFrameHandled = true;

        const elapsed = Date.now() - loaderStartTime;
        const remainingTime = Math.max(
          0,
          minimumLoaderTime - elapsed
        );

        setTimeout(() => {
          const loader = document.getElementById(
            "loading-screen"
          );

          if (!loader) return;

          loader.classList.add("hide");

          setTimeout(() => {
            loader.remove();
          }, 500);
        }, remainingTime);
      });
    })();
  </script>

</body>
</html>
